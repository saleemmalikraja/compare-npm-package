<div class="search-layout">
  <mat-card class="filter">
    <div class="filter__header">
      <div>
        <h2>Package search</h2>
        <p>Add packages to compare downloads, GitHub stats, and install details.</p>
      </div>
    </div>

    <mat-form-field class="filter__field" appearance="outline">
      <mat-label>Search package here</mat-label>

      <mat-chip-grid #chipGrid aria-label="Selected packages">
        <mat-chip-row *ngFor="let lib of libs" [selectable]="selectable" [removable]="removable" (removed)="remove(lib)" [color]="'primary'">
          {{lib.split('-')[0].trim()}}
          <button matChipRemove *ngIf="removable" aria-label="Remove package">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>

        <input #libsInput placeholder="lodash, rxjs, express..." [formControl]="formCtrl" [matAutocomplete]="auto"
          [matChipInputFor]="chipGrid" [matChipInputSeparatorKeyCodes]="separatorKeyCodes" [matChipInputAddOnBlur]="addOnBlur"
          (matChipInputTokenEnd)="add($event)">
      </mat-chip-grid>

      <button *ngIf="libs.length" mat-icon-button matSuffix type="button" (click)="clearAll()" aria-label="Clear all packages">
        <mat-icon>close</mat-icon>
      </button>

      <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption (optionSelected)="selected($event)">
        <mat-option *ngFor="let lib of filteredLibs" [value]="lib">
          {{lib}}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
  </mat-card>

  <app-npm-tab [packageData]="packageData"></app-npm-tab>
</div>
