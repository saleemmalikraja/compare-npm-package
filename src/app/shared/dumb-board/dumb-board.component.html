<div *ngIf="dataSource.length" class="board-container">
  <div class="board-toolbar">
    <mat-form-field appearance="outline" class="board-select">
      <mat-label>Select package</mat-label>
      <mat-select [(value)]="selectedPackage" (selectionChange)="onSelect($event.value)">
        <mat-option *ngFor="let option of dataSource" [value]="option.packageName">{{option.packageName}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="board-grid">
    <div class="board-card" *ngIf="selectedPackage && version">
      <span class="labeltext">Version</span>
      <strong>{{version}}</strong>
    </div>

    <button type="button" class="board-card board-card--action" *ngIf="selectedPackage && licenseName"
      (click)="copyMessage(licenseName)">
      <span class="board-card__top">
        <span class="labeltext">License</span>
        <mat-icon>content_copy</mat-icon>
      </span>
      <strong>{{licenseName}}</strong>
    </button>

    <button type="button" class="board-card board-card--action" *ngIf="selectedPackage && npmInstall"
      (click)="copyMessage(npmInstall)">
      <span class="board-card__top">
        <span class="labeltext">Install</span>
        <mat-icon>file_copy</mat-icon>
      </span>
      <strong>{{npmInstall}}</strong>
    </button>

    <button type="button" class="board-card board-card--action" *ngIf="selectedPackage && gitCloneUrl"
      (click)="copyMessage(gitCloneUrl)">
      <span class="board-card__top">
        <span class="labeltext">Clone</span>
        <mat-icon>cloud_download</mat-icon>
      </span>
      <strong>{{gitCloneUrl}}</strong>
    </button>

    <a class="board-card board-card--link" *ngIf="selectedPackage && homePageUrl" [href]="homePageUrl" target="_blank"
      rel="noopener">
      <span class="board-card__top">
        <span class="labeltext">GitHub</span>
        <mat-icon>open_in_new</mat-icon>
      </span>
      <strong>{{homePageUrl}}</strong>
    </a>
  </div>
</div>
