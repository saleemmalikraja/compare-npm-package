<div *ngIf="dataSource.length" class="table-shell">
  <div class="table-shell__scroll">
    <table mat-table [dataSource]="dataSource" class="compare-table mat-elevation-z8">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Package name</th>
        <td mat-cell *matCellDef="let element">{{element.name}}</td>
      </ng-container>

      <ng-container matColumnDef="stargazers_count">
        <th mat-header-cell *matHeaderCellDef>Stars</th>
        <td mat-cell *matCellDef="let element">{{element.stargazers_count}}</td>
      </ng-container>

      <ng-container matColumnDef="forks">
        <th mat-header-cell *matHeaderCellDef>Forks</th>
        <td mat-cell *matCellDef="let element">{{element.forks}}</td>
      </ng-container>

      <ng-container matColumnDef="updated_at">
        <th mat-header-cell *matHeaderCellDef>Updated</th>
        <td mat-cell *matCellDef="let element">{{element?.updated_at | date}}</td>
      </ng-container>

      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef class="hide-mobile">Created</th>
        <td mat-cell *matCellDef="let element" class="hide-mobile">{{element?.created_at | date}}</td>
      </ng-container>

      <ng-container matColumnDef="subscribers_count">
        <th mat-header-cell *matHeaderCellDef>Watchers</th>
        <td mat-cell *matCellDef="let element">{{element.subscribers_count}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
